# Fly.io configuration for AetherGuard AI Security Monitor
# Zero-cost persistent 24/7 deployment

app = "aether-guard-monitor"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  API_HOST = "0.0.0.0"
  API_PORT = "8080"
  SCHEDULER_ENABLED = "true"
  DATA_DIR = "/app/data"

[mounts]
  source = "aether_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"
