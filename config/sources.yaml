  # Academic & Frontier Research
  - name: "arXiv AI Papers (cs.AI, cs.LG, cs.CL, cs.CV)"
    category: "ai_research"
    type: "arxiv"
    query: "cat:cs.AI OR cat:cs.LG OR cat:cs.CL OR cat:cs.CV OR cat:cs.RO OR cat:stat.ML"
    max_results: 50
    rate_limit_seconds: 1800
    enabled: true

  - name: "arXiv AI Safety & Alignment (Pre-CVE Radar)"
    category: "ai_research"
    type: "arxiv"
    query: "(cat:cs.CR AND (ti:LLM OR ti:\"language model\" OR ti:adversarial OR ti:jailbreak OR ti:agent OR ti:safety OR ti:alignment))"
    max_results: 30
    rate_limit_seconds: 1800
    enabled: true

  - name: "MIT News AI"
    category: "ai_research"
    type: "rss"
    url: "https://news.mit.edu/rss/topic/artificial-intelligence2"
