  # ==========================================
  # CVE & VULNERABILITY FEEDS
  # ==========================================
  # NVD API v2.0 - Using REST API instead of deprecated XML feeds
  - name: "NVD Recent CVEs (API)"
    category: "vulnerabilities"
    type: "nvd_api"
    rate_limit_seconds: 3600
    enabled: true

  - name: "CISA Known Exploited Vulnerabilities"
    category: "vulnerabilities"
    type: "cisa_kev_json"
    url: "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
    rate_limit_seconds: 3600
    enabled: true

  - name: "GitHub Security Advisories"
    category: "vulnerabilities"
    type: "github_advisories"
    rate_limit_seconds: 3600
    enabled: true

  # ==========================================
  # GITHUB TRENDING SECURITY REPOS
  # ==========================================
  - name: "GitHub Trending Security (Daily)"
    category: "github_trending"
    type: "github_trending"
    since: "daily"
    rate_limit_seconds: 3600
    enabled: true

  - name: "GitHub Trending Security (Weekly)"
    category: "github_trending"
    type: "github_trending"
    since: "weekly"
    rate_limit_seconds: 86400
    enabled: true


# Delivery Configuration (user picks one at runtime)
delivery:
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    username: ""
    password: ""
    from_email: ""
    to_email: ""

  slack:
    enabled: false
    webhook_url: ""
    channel: "#general"

  telegram:
    enabled: true
    bot_token: "8426550330:AAG_pnhsbIyzb2HI15nZBnTveIX_RN1NSow"
    chat_id: "1650972026"

  console:
    enabled: true  # Always available as fallback


# Digest Settings
digest:
  schedule: "daily"  # "daily" or "weekly"
  time: "08:00"  # Local time
  max_items_per_category: 10
  include_summary: true
  summary_max_length: 300
  timezone: "Asia/Kolkata"


# Database
database:
  path: "data/monitor.db"


# Logging
logging:
  level: "INFO"
  file: "logs/monitor.log"
  max_size_mb: 10
  backup_count: 5


# AI Analyzer Configuration
analyzer:
  ollama_host: "http://localhost:11434"
  model: "llama3.2:3b"
  # Fallback API (optional - set GROQ_API_KEY or OPENROUTER_API_KEY env var)
  fallback_api_key: ""
  fallback_base_url: "https://api.groq.com/openai/v1"
  fallback_model: "llama-3.1-8b-instant"
  timeout: 60
  max_tokens: 1000
  temperature: 0.1