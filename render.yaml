services:
  - type: web
    name: ai-security-monitor
    runtime: python
    buildCommand: "pip install -e ."
    startCommand: "uvicorn ai_security_monitor.presentation.api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENVIRONMENT
        value: "production"
      - key: DATA_DIR
        value: "/data"
      - key: ADMIN_API_KEY
        generateValue: true
    disk:
      name: aetherguard-data
      mountPath: /data
      sizeGB: 1
