[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-monitor"
version = "2.0.0"
description = "Zero-cost autonomous monitoring for AI technology launches and cybersecurity threats"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Thor", email = "thor@example.com"}
]
keywords = ["security", "ai", "monitoring", "threat-intelligence", "cybersecurity", "zero-cost"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "typer[all]>=0.12",
    "rich>=13.7",
    "apscheduler>=3.10",
    "structlog>=24.1",
    "prometheus-client>=0.19",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "reportlab>=4.0",
    "edge-tts>=7.0.0",
    "gtts>=2.5.0",
    "deep-translator>=1.11.4",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "pytest-mock>=3.13",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.3",
    "pre-commit>=3.7",
    "types-requests>=2.31",
    "types-pyyaml>=6.0",
]
llm = [
    "ollama>=0.3",
    "groq>=0.7",
]
all = ["dev", "llm"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ai_security_monitor*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008", "F401", "E402", "B904", "UP042", "W291", "B007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "fastapi.*", "pydantic.*", "httpx.*", "apscheduler.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--cov=src/ai_security_monitor", "--cov-report=term-missing", "--cov-report=html:htmlcov"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''/(\.venv|\.git|__pycache__|htmlcov|\.ruff_cache|\.mypy_cache)/'''

[tool.coverage.run]
source = ["src/ai_security_monitor"]
omit = ["tests/*", "src/ai_security_monitor/presentation/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError", "if __name__ == .__main__.:",]

[tool.alembic]
script_location = "src/ai_security_monitor/infrastructure/database/migrations"
sqlalchemy.url = "sqlite+aiosqlite:///data/monitor.db"

[tool.ai_security_monitor]
dev = "uvicorn ai_security_monitor.presentation.api.main:create_app --reload --port 8000"
cli = "python -m ai_security_monitor"
fetch = "python -m ai_security_monitor fetch"
analyze = "python -m ai_security_monitor analyze"
digest = "python -m ai_security_monitor digest"
server = "python -m ai_security_monitor server"
migrate = "alembic upgrade head"
makemigrations = "alembic revision --autogenerate -m"
test = "pytest"
lint = "ruff check . && mypy src"
format = "ruff format . && black ."
